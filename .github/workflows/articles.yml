# Worker المقالات: 3 مقالات يومياً (~1000 كلمة) عبر Pollinations.ai المجاني بدون مفتاح، ثم بناء ونشر على Firebase.
name: Daily articles

on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 بتوقيت السعودية
    - cron: "0 11 * * *"  # 14:00
    - cron: "0 17 * * *"  # 20:00
  workflow_dispatch:
    inputs:
      count:
        description: "عدد المقالات في هذا التشغيل"
        default: "1"

permissions:
  contents: write

concurrency:
  group: articles
  cancel-in-progress: false

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOBTOOLS_CV_GENERATOR != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write article(s)
        id: gen
        timeout-minutes: 45
        run: node scripts/generate-article.mjs --count "${{ github.event.inputs.count || '1' }}"

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          if git diff --quiet -- src/data/generatedArticles.json; then
            echo "No new article"; exit 0
          fi
          git config user.name "articles-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generatedArticles.json
          git commit -m "Add article(s): ${{ steps.gen.outputs.new_urls }}"
          git push

      - name: Deploy to Firebase Hosting
        if: env.HAS_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOBTOOLS_CV_GENERATOR }}
          projectId: jobtools-cv-generator
          target: cv-generator
          channelId: live

      - name: Ping IndexNow (Bing / Yandex)
        if: env.HAS_FIREBASE == 'true' && steps.gen.outputs.new_urls != ''
        run: npm run indexnow -- ${{ steps.gen.outputs.new_urls }} /blog
